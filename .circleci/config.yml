version: 2.1

jobs:
  X35:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: First warn the partner team
          command: |
            mkdir -p /tmp/shard3
            set +o pipefail 2>/dev/null; head -c 500000 /dev/urandom | tr -dc 'AEIOU' | fold -w 20 > /tmp/shard3/txt_Delta.atoll; true
            echo "done $(wc -c </tmp/shard3/txt_Delta.atoll)"
      - persist_to_workspace:
          root: /tmp/shard3
          paths:
            - 'txt_Delta.atoll'
  bug-2659:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/shard3
      - run:
          name: Harvest gate data
          command: |
            sed -n '$!N;/\n$/!{P;D;};D' /tmp/shard3/txt_Delta.atoll 2>/dev/null | wc -l || true
      - run:
          name: Fetch repository
          command: git clone --depth 5 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress bundle
          command: tar -xz -f artifacts.tgz
      - run:
          name: Cooldown
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: g++ --version
      - run:
          command: nice -n 0 ./parser
  guardsetup:
